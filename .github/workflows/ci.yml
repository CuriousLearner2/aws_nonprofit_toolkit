name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIVEBUTTER_DIR: ${{ github.workspace }}/aws_nonprofit_toolkit/Givebutter

jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            ${{ env.GIVEBUTTER_DIR }}/requirements.txt
            ${{ env.GIVEBUTTER_DIR }}/requirements-test.txt

      - name: Verify clean runner assumptions
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          test ! -e "$GIVEBUTTER_DIR/.venv"

      - name: Create and install Givebutter virtualenv
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$pythonLocation/bin/python" -m venv "$GIVEBUTTER_DIR/.venv"
          "$GIVEBUTTER_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$GIVEBUTTER_DIR/.venv/bin/python" -m pip install -r requirements.txt -r requirements-test.txt
          echo "$GIVEBUTTER_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify Givebutter virtualenv resolution
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          set -euo pipefail
          export PATH="$GIVEBUTTER_DIR/.venv/bin:$PATH"
          printf '%s\n' "$GITHUB_WORKSPACE"
          printf '%s\n' "$GIVEBUTTER_DIR"
          test -x "$GIVEBUTTER_DIR/.venv/bin/python"
          test -x "$GIVEBUTTER_DIR/.venv/bin/pytest"
          command -v python
          command -v pytest
          python -c "import sys; print(sys.executable)"
          "$GIVEBUTTER_DIR/.venv/bin/python" -c "import sys; print(sys.executable)"
          case "$(command -v python)" in
            "$GIVEBUTTER_DIR/.venv/bin/python") ;;
            *)
              echo "❌ python does not resolve to the Givebutter virtualenv" >&2
              exit 1
              ;;
          esac
          case "$(command -v pytest)" in
            "$GIVEBUTTER_DIR/.venv/bin/pytest") ;;
            *)
              echo "❌ pytest does not resolve to the Givebutter virtualenv" >&2
              exit 1
              ;;
          esac
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          venv_executable="$("$GIVEBUTTER_DIR/.venv/bin/python" -c 'import sys; print(sys.executable)')"
          case "$python_executable" in
            "$GIVEBUTTER_DIR/.venv/bin/python") ;;
            *)
              echo "❌ python sys.executable is not inside the Givebutter virtualenv" >&2
              exit 1
              ;;
          esac
          case "$venv_executable" in
            "$GIVEBUTTER_DIR/.venv/bin/python") ;;
            *)
              echo "❌ direct Givebutter virtualenv python resolved unexpectedly" >&2
              exit 1
              ;;
          esac

      - name: Verify core imports
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" -c "import email_validator, flask, pandas, phonenumbers, sqlalchemy; print('imports-ok')"

      - name: Run canonical unit and integration tests
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" \
            "$GIVEBUTTER_DIR/scripts/ci/test_gate.py" \
            --timeout 900 \
            -- "$GIVEBUTTER_DIR/.venv/bin/python" -m pytest tests/unit tests/integration -x

      - name: Check blocking artifacts
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" "$GIVEBUTTER_DIR/scripts/ci/check_no_artifacts.py"

      - name: Check added tracked artifacts
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" - <<'PY'
          import os
          import subprocess
          import sys

          sys.path.insert(0, "scripts/ci")
          from check_no_artifacts import is_blocked_artifact

          base_sha = os.environ["BASE_SHA"].strip()
          head_sha = os.environ["HEAD_SHA"].strip()
          if not base_sha:
              default_branch = os.environ["DEFAULT_BRANCH"].strip() or "main"
              subprocess.run(["git", "fetch", "origin", default_branch], check=True)
              base_sha = subprocess.check_output(
                  ["git", "merge-base", f"origin/{default_branch}", head_sha],
                  text=True,
              ).strip()

          result = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", "--find-renames", base_sha, head_sha],
              capture_output=True,
              text=True,
              check=True,
          )
          blocked = [path for path in result.stdout.splitlines() if path and is_blocked_artifact(path)]
          if blocked:
              print("❌ Found tracked artifact files that must not be committed:", file=sys.stderr)
              for artifact in sorted(blocked):
                  print(f"  - {artifact}", file=sys.stderr)
              print("\nPlease remove these files or add them to .gitignore if intentional.", file=sys.stderr)
              sys.exit(1)
          print("✅ No tracked artifact additions or renames found")
          PY

      - name: Compile repository Python files
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" -m compileall scripts tests

  browser-e2e:
    name: Browser E2E checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: baseline

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            ${{ env.GIVEBUTTER_DIR }}/requirements.txt
            ${{ env.GIVEBUTTER_DIR }}/requirements-test.txt

      - name: Create and install Givebutter virtualenv
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$pythonLocation/bin/python" -m venv "$GIVEBUTTER_DIR/.venv"
          "$GIVEBUTTER_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$GIVEBUTTER_DIR/.venv/bin/python" -m pip install -r requirements.txt -r requirements-test.txt
          echo "$GIVEBUTTER_DIR/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify browser runtime assumptions
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          set -euo pipefail
          export PATH="$GIVEBUTTER_DIR/.venv/bin:$PATH"
          printf '%s\n' "$GITHUB_WORKSPACE"
          printf '%s\n' "$GIVEBUTTER_DIR"
          test -x "$GIVEBUTTER_DIR/.venv/bin/python"
          test -x "$GIVEBUTTER_DIR/.venv/bin/pytest"
          command -v python
          command -v pytest
          python -c "import sys; print(sys.executable)"
          "$GIVEBUTTER_DIR/.venv/bin/python" -c "import sys; print(sys.executable)"
          "$GIVEBUTTER_DIR/.venv/bin/python" -c "from importlib.metadata import version; import sys; print(version('playwright')); print(sys.executable)"

      - name: Install Playwright Chromium
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" -m playwright install --with-deps chromium

      - name: Run browser E2E checks
        working-directory: ${{ env.GIVEBUTTER_DIR }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          "$GIVEBUTTER_DIR/.venv/bin/python" \
            "$GIVEBUTTER_DIR/scripts/ci/e2e_gate.py" \
            --timeout 1800 \
            -- "$GIVEBUTTER_DIR/.venv/bin/python" -m pytest \
            tests/e2e/test_e2e_upload_workflow.py::test_upload_drop_zone_ignores_empty_drop_and_recovers \
            tests/e2e/test_e2e_upload_workflow.py::test_upload_drop_zone_rejects_invalid_drop_and_recovers_with_drag_drop \
            tests/e2e/test_e2e_upload_workflow.py::test_upload_drop_zone_blocks_repeated_drops_while_upload_is_in_flight \
            tests/e2e/test_e2e_upload_workflow.py::test_upload_non_givebutter_csv_shows_inline_error_banner \
            tests/e2e/test_validation_export_blocking.py::test_validation_blocker_appears_in_export_console \
            tests/e2e/test_validation_export_blocking.py::test_failed_autosave_values_not_exported \
            tests/e2e/test_validation_export_blocking.py::test_persisted_validation_override_allows_export \
            tests/e2e/test_validation_export_blocking.py::test_clean_validation_export_proceeds \
            tests/e2e/test_validation_review_dom.py::test_all_inline_fields_persist_after_browser_refresh \
            tests/e2e/test_e2e_decision_workflow.py::test_save_all_decisions_completes_review \
            tests/e2e/test_desktop_canonical_screens_smoke.py::test_desktop_canonical_screens_smoke \
            -x
